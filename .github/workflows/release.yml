name: Release

# Builds the Windows and Linux installers and attaches them to a GitHub Release.
# The macOS .dmg files are built locally on Apple Silicon and uploaded with
# `pnpm release:mac` (see README). Triggered by pushing a tag like `v0.1.1`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download sidecars (yt-dlp, ffmpeg, ffprobe, deno)
        run: node scripts/fetch-sidecars.mjs ${{ matrix.target }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Streamline ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            ## Descargas

            | Sistema | Archivo |
            | --- | --- |
            | macOS (Apple Silicon M1–M4) | `Streamline_*_aarch64.dmg` |
            | macOS (Intel) | `Streamline_*_x64.dmg` |
            | Windows | `Streamline_*_x64-setup.exe` o `.msi` |
            | Linux | `.AppImage`, `.deb` o `.rpm` |

            **macOS:** la app no está firmada con un certificado de Apple. Si macOS dice que está dañada, ejecuta
            `xattr -cr /Applications/Streamline.app` una vez tras instalarla.

            **Windows:** si SmartScreen la bloquea, pulsa «Más información» → «Ejecutar de todas formas».
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
