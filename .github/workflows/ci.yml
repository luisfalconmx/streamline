name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Type-check and build frontend
        run: pnpm build
      - name: Cargo check
        working-directory: src-tauri
        run: |
          # tauri-build validates that sidecars exist; empty placeholders are enough for `check`.
          T=$(rustc -vV | sed -n 's/host: //p')
          for b in yt-dlp ffmpeg ffprobe deno; do touch "binaries/$b-$T"; done
          cargo clippy --locked -- -D warnings
