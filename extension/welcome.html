<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Streamline está listo</title>
    <link rel="icon" href="icons/icon-32.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0d;
        --card: #18181b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --accent: #0a84ff;
        --success: #34c759;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f4f4f5;
          --card: #fff;
          --fg: #18181b;
          --muted: #71717a;
          --border: #e4e4e7;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
      }
      main {
        width: min(520px, calc(100vw - 32px));
        padding: 32px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 24px;
        text-align: center;
      }
      img {
        border-radius: 16px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.5;
      }
      ol {
        margin: 20px 0;
        padding: 0;
        list-style: none;
        text-align: left;
        display: grid;
        gap: 12px;
      }
      li {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        line-height: 1.45;
      }
      li span {
        flex: none;
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
      }
      button {
        margin-top: 4px;
        padding: 12px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: 600 15px inherit;
        font-family: inherit;
        cursor: pointer;
      }
      button.ok {
        background: var(--success);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icons/icon-128.png" width="72" height="72" alt="" />
      <h1>¡La extensión está instalada!</h1>
      <p>Falta conectarla con la app de Streamline.</p>
      <ol>
        <li><span>1</span><div>Cuando el navegador pregunte <b>«¿Abrir Streamline?»</b>, marca <b>Permitir siempre</b> y pulsa <b>Abrir</b>.</div></li>
        <li><span>2</span><div>Fija el icono: pulsa la pieza de puzzle 🧩 de la barra y luego el alfiler 📌 junto a Streamline.</div></li>
      </ol>
      <button id="connect" type="button">Conectar con Streamline</button>
    </main>
    <script type="module" src="welcome.js"></script>
  </body>
</html>
