<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Streamline</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="icons/icon-32.png" alt="" width="24" height="24" />
        <span>Streamline</span>
      </div>
      <span id="count" class="count"></span>
    </header>

    <main id="list" class="list" aria-live="polite"></main>

    <template id="card-tpl">
      <article class="card">
        <div class="thumb">
          <span class="thumb-empty">Sin miniatura</span>
          <span class="badge-duration" hidden></span>
        </div>
        <div class="body">
          <div class="chips"></div>
          <h2 class="title"></h2>
          <div class="meta"></div>
          <div class="actions">
            <a class="open" target="_blank" rel="noreferrer">
              Abrir en el navegador
              <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <button class="download" type="button">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Descargar en la app</span>
            </button>
          </div>
        </div>
      </article>
    </template>

    <footer class="footer">
      Necesitas la app <b>Streamline</b> instalada. Si no aparece un video, reprodúcelo y vuelve a abrir este panel.
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
